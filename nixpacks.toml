# Nixpacks configuration for Railway
[phases.setup]
nixPkgs = ["python310", "gcc", "cmake"]

[phases.install]
cmds = ["cd backend && pip install -r requirements.txt"]

[phases.build]
cmds = ["cd backend && python manage.py collectstatic --noinput"]

[start]
cmd = "cd backend && python manage.py migrate && gunicorn StressDetection.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
