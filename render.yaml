services:
  # Backend Web Service (Django) — serves both API and frontend templates
  - type: web
    name: stress-detection-in-it-employees
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn StressDetection.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: DJANGO_DEBUG
        value: "False"
